[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# The contact form moved from the homepage to the About page.
[[redirects]]
  from = "/contact.html"
  to = "/about.html#contact"
  status = 301

# Old sitemap/page paths that never had a trailing .html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 301
